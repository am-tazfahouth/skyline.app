name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --exclude-tags integration

  build-release:
    name: Build & Publish Release APKs
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check signing secrets
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. Configure the release signing secrets before pushing a version tag."
          exit 1

      - name: Configure release signing keys
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_B64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          echo "::notice::keystore base64 length: ${#KEYSTORE_B64}"
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty after cleanup. Recreate it from: base64 -w0 android/app/sky_line_upload.jks"
            exit 1
          fi
          if [[ ! "$KEYSTORE_B64" =~ ^[A-Za-z0-9+/=]+$ ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 contains non-base64 characters. Paste a single-line value from: base64 -w0 android/app/sky_line_upload.jks"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/sky_line_upload.jks
          test -s android/app/sky_line_upload.jks || {
            echo "::error::decoded keystore is empty"
            exit 1
          }
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=sky_line_upload.jks
          EOF

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/*.apk